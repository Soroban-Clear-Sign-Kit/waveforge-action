name: Self-Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Self-Test (repo mode offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WaveForge on this repository
        uses: ./
        with:
          mode: repo
          offline: "true"
