name: Spike
description: Propose an exploratory investigation or research spike
labels: ["spike"]
body:
  - type: textarea
    id: question-to-answer
    attributes:
      label: Question to answer
      description: What specific technical question or uncertainty does this spike aim to resolve?
    validations:
      required: true
  - type: textarea
    id: what-to-investigate
    attributes:
      label: What to investigate
      description: Describe the areas, dependencies, or architectures to research.
    validations:
      required: true
  - type: textarea
    id: expected-output
    attributes:
      label: Expected output
      description: Describe the expected deliverable (e.g., benchmark numbers, decision log entry, prototype).
    validations:
      required: true
